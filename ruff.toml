[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501", "I001"]

[lint.isort]
known-first-party = ["apps", "config", "tests"]

[lint.per-file-ignores]
"config/settings/*.py" = ["F401", "F403", "F405"]
"conftest.py" = ["F401"]
"**/migrations/*.py" = ["I001"]

[format]
quote-style = "double"
indent-style = "space"
