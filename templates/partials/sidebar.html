{% load static %}
<aside class="fixed inset-y-0 left-0 z-30 bg-sidebar text-white flex flex-col transition-all duration-300"
    :class="sidebarOpen ? 'w-64' : 'w-16'">

    <!-- Logo -->
    <div class="flex items-center h-16 px-4 border-b border-white/[.06] shrink-0">
        <div
            class="w-8 h-8 rounded-lg bg-gradient-to-br from-brand to-accent flex items-center justify-center shrink-0">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        </div>
        <span class="ml-3 text-base font-bold tracking-tight whitespace-nowrap" x-show="sidebarOpen"
            x-cloak>TaskFlow</span>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 py-4 space-y-1 overflow-y-auto px-2">
        <div class="px-3 mb-3" x-show="sidebarOpen" x-cloak>
            <span class="text-[10px] font-semibold uppercase tracking-wider text-white/30">Main</span>
        </div>

        <a href="{% url 'dashboard_home' %}"
            class="flex items-center px-3 py-2.5 rounded-xl text-sm font-medium transition-all
                  {% if request.resolver_match.url_name == 'dashboard_home' %}bg-brand/15 text-brand-light{% else %}text-white/60 hover:bg-white/[.06] hover:text-white{% endif %}">
            <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0h4" />
            </svg>
            <span class="ml-3 whitespace-nowrap" x-show="sidebarOpen" x-cloak>Dashboard</span>
        </a>

        <a href="{% url 'dashboard_projects' %}"
            class="flex items-center px-3 py-2.5 rounded-xl text-sm font-medium transition-all
                  {% if 'project' in request.resolver_match.url_name %}bg-brand/15 text-brand-light{% else %}text-white/60 hover:bg-white/[.06] hover:text-white{% endif %}">
            <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
            </svg>
            <span class="ml-3 whitespace-nowrap" x-show="sidebarOpen" x-cloak>Projects</span>
        </a>

        <div class="px-3 mt-6 mb-3" x-show="sidebarOpen" x-cloak>
            <span class="text-[10px] font-semibold uppercase tracking-wider text-white/30">Insights</span>
        </div>

        <a href="{% url 'dashboard_analytics' %}"
            class="flex items-center px-3 py-2.5 rounded-xl text-sm font-medium transition-all
                  {% if request.resolver_match.url_name == 'dashboard_analytics' %}bg-brand/15 text-brand-light{% else %}text-white/60 hover:bg-white/[.06] hover:text-white{% endif %}">
            <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
            </svg>
            <span class="ml-3 whitespace-nowrap" x-show="sidebarOpen" x-cloak>Analytics</span>
        </a>

        <a href="{% url 'dashboard_performance' %}"
            class="flex items-center px-3 py-2.5 rounded-xl text-sm font-medium transition-all
                  {% if request.resolver_match.url_name == 'dashboard_performance' %}bg-brand/15 text-brand-light{% else %}text-white/60 hover:bg-white/[.06] hover:text-white{% endif %}">
            <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
            </svg>
            <span class="ml-3 whitespace-nowrap" x-show="sidebarOpen" x-cloak>Performance</span>
        </a>

        <a href="{% url 'dashboard_activity' %}"
            class="flex items-center px-3 py-2.5 rounded-xl text-sm font-medium transition-all
                  {% if request.resolver_match.url_name == 'dashboard_activity' %}bg-brand/15 text-brand-light{% else %}text-white/60 hover:bg-white/[.06] hover:text-white{% endif %}">
            <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span class="ml-3 whitespace-nowrap" x-show="sidebarOpen" x-cloak>Activity</span>
        </a>

        <div class="px-3 mt-6 mb-3" x-show="sidebarOpen" x-cloak>
            <span class="text-[10px] font-semibold uppercase tracking-wider text-white/30">Admin</span>
        </div>

        <a href="{% url 'dashboard_invitations' %}"
            class="flex items-center px-3 py-2.5 rounded-xl text-sm font-medium transition-all
                  {% if request.resolver_match.url_name == 'dashboard_invitations' %}bg-brand/15 text-brand-light{% else %}text-white/60 hover:bg-white/[.06] hover:text-white{% endif %}">
            <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
            </svg>
            <span class="ml-3 whitespace-nowrap" x-show="sidebarOpen" x-cloak>Invitations</span>
        </a>

        <a href="{% url 'dashboard_notifications' %}"
            class="flex items-center px-3 py-2.5 rounded-xl text-sm font-medium transition-all
                  {% if request.resolver_match.url_name == 'dashboard_notifications' %}bg-brand/15 text-brand-light{% else %}text-white/60 hover:bg-white/[.06] hover:text-white{% endif %}">
            <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
            <span class="ml-3 whitespace-nowrap" x-show="sidebarOpen" x-cloak>Notifications</span>
        </a>

        <a href="{% url 'dashboard_audit' %}"
            class="flex items-center px-3 py-2.5 rounded-xl text-sm font-medium transition-all
                  {% if request.resolver_match.url_name == 'dashboard_audit' %}bg-brand/15 text-brand-light{% else %}text-white/60 hover:bg-white/[.06] hover:text-white{% endif %}">
            <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5l5 5v11a2 2 0 01-2 2z" />
            </svg>
            <span class="ml-3 whitespace-nowrap" x-show="sidebarOpen" x-cloak>Audit Log</span>
        </a>
    </nav>

    <!-- Collapse -->
    <div class="border-t border-white/[.06] p-3 shrink-0">
        <button @click="sidebarOpen = !sidebarOpen"
            class="flex items-center w-full px-3 py-2 rounded-xl text-white/40 hover:text-white hover:bg-white/[.06] transition-all text-sm">
            <svg class="w-5 h-5 shrink-0 transition-transform duration-300" :class="sidebarOpen ? '' : 'rotate-180'"
                fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
            </svg>
            <span class="ml-3 whitespace-nowrap" x-show="sidebarOpen" x-cloak>Collapse</span>
        </button>
    </div>
</aside>
