<!-- Top Bar -->
<header
    class="sticky top-0 z-20 bg-white/80 dark:bg-[#0f1629]/80 backdrop-blur-xl border-b border-gray-200/60 dark:border-white/[.06] h-16 flex items-center justify-between px-6 lg:px-8 shrink-0">
    <div class="flex items-center gap-4">
        <h1 class="text-lg font-bold text-gray-900 dark:text-white">{% block page_title %}Dashboard{% endblock %}</h1>
    </div>

    <div class="flex items-center gap-3">
        {% if user.organization %}
        <div
            class="hidden sm:flex items-center gap-2 px-3 py-1.5 bg-brand/[.08] text-brand dark:text-brand-light rounded-lg text-xs font-semibold">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
            </svg>
            {{ user.organization.name }}
        </div>
        {% endif %}

        <!-- Dark Mode -->
        <button @click="darkMode = !darkMode"
            class="p-2 rounded-lg text-gray-400 hover:text-gray-600 dark:text-white/40 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-white/[.06] transition-all">
            <svg x-show="!darkMode" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
            <svg x-show="darkMode" x-cloak class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
        </button>

        <!-- User Menu -->
        <div x-data="{ open: false }" class="relative">
            <button @click="open = !open"
                class="flex items-center gap-2.5 px-3 py-1.5 rounded-xl hover:bg-gray-100 dark:hover:bg-white/[.06] transition-all">
                <div
                    class="w-8 h-8 rounded-full bg-gradient-to-br from-brand to-accent flex items-center justify-center text-white text-xs font-bold">
                    {{ user.email|first|upper }}
                </div>
                <div class="hidden sm:block text-left">
                    <div class="text-sm font-semibold text-gray-800 dark:text-white">{{ user.first_name|default:user.email }}</div>
                    <div class="text-[11px] text-gray-400 dark:text-white/40 capitalize">{{ user.role }}</div>
                </div>
                <svg class="w-4 h-4 text-gray-400 dark:text-white/30" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                </svg>
            </button>

            <div x-show="open" @click.away="open = false" x-cloak x-transition:enter="transition ease-out duration-150"
                x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
                class="absolute right-0 mt-2 w-52 bg-white dark:bg-[#162032] rounded-xl shadow-xl border border-gray-200/60 dark:border-white/[.08] py-1.5 z-50">
                <div class="px-4 py-2.5 border-b border-gray-100 dark:border-white/[.06]">
                    <div class="text-sm font-semibold truncate text-gray-800 dark:text-white">{{ user.email }}</div>
                    <div class="text-[11px] text-gray-400 dark:text-white/40 capitalize mt-0.5">{{ user.role }} · {{ user.organization.name|default:"No Org" }}</div>
                </div>
                <a href="{% url 'dashboard_home' %}"
                    class="flex items-center gap-2 px-4 py-2 text-sm text-gray-600 dark:text-white/60 hover:bg-gray-50 dark:hover:bg-white/[.04]">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0h4" />
                    </svg>
                    Dashboard
                </a>
                <form method="post" action="{% url 'dashboard_logout' %}">
                    {% csrf_token %}
                    <button type="submit"
                        class="flex items-center gap-2 w-full text-left px-4 py-2 text-sm text-danger hover:bg-gray-50 dark:hover:bg-white/[.04]">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                        Sign Out
                    </button>
                </form>
            </div>
        </div>
    </div>
</header>
