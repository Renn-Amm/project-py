{% extends "base.html" %}
{% block title %}New Task — {{ project.name }} — TaskFlow{% endblock %}
{% block page_title %}New Task{% endblock %}

{% block content %}
<div class="fade-up max-w-3xl">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h2 class="text-2xl font-bold text-gray-900 dark:text-white">New Task</h2>
            <p class="text-sm text-gray-500 dark:text-white/40 mt-1">Project: {{ project.name }}</p>
        </div>
        <a href="{% url 'dashboard_project_detail' pk=project.id %}"
            class="text-sm text-brand dark:text-brand-light font-medium flex items-center gap-1 hover:text-brand-dark transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
            Back
        </a>
    </div>

    <form method="post" action="{% url 'dashboard_task_create' project_pk=project.id %}"
        class="rounded-2xl border border-gray-200/60 dark:border-white/[.06] bg-white dark:bg-white/[.02] p-6 space-y-5">
        {% csrf_token %}

        <div>
            <label class="block text-xs font-medium text-gray-600 dark:text-white/60 mb-1.5">Title</label>
            <input name="title" required
                class="w-full rounded-xl border border-gray-200 dark:border-white/10 bg-white dark:bg-white/[.04] px-3 py-2.5 text-sm text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-white/30 focus:ring-2 focus:ring-brand/50 transition-all" />
        </div>

        <div>
            <label class="block text-xs font-medium text-gray-600 dark:text-white/60 mb-1.5">Description</label>
            <textarea name="description" rows="4"
                class="w-full rounded-xl border border-gray-200 dark:border-white/10 bg-white dark:bg-white/[.04] px-3 py-2.5 text-sm text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-white/30 focus:ring-2 focus:ring-brand/50 transition-all"></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-xs font-medium text-gray-600 dark:text-white/60 mb-1.5">Priority</label>
                <select name="priority"
                    class="w-full rounded-xl border border-gray-200 dark:border-white/10 bg-white dark:bg-white/[.04] px-3 py-2.5 text-sm text-gray-900 dark:text-white focus:ring-2 focus:ring-brand/50 transition-all">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                    <option value="critical">Critical</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-600 dark:text-white/60 mb-1.5">Deadline</label>
                <input type="datetime-local" name="deadline"
                    class="w-full rounded-xl border border-gray-200 dark:border-white/10 bg-white dark:bg-white/[.04] px-3 py-2.5 text-sm text-gray-900 dark:text-white focus:ring-2 focus:ring-brand/50 transition-all" />
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-600 dark:text-white/60 mb-1.5">Estimate (hours)</label>
                <input name="estimated_time_hours" placeholder="e.g. 6"
                    class="w-full rounded-xl border border-gray-200 dark:border-white/10 bg-white dark:bg-white/[.04] px-3 py-2.5 text-sm text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-white/30 focus:ring-2 focus:ring-brand/50 transition-all" />
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-600 dark:text-white/60 mb-1.5">Assignee</label>
                <select name="assignee"
                    class="w-full rounded-xl border border-gray-200 dark:border-white/10 bg-white dark:bg-white/[.04] px-3 py-2.5 text-sm text-gray-900 dark:text-white focus:ring-2 focus:ring-brand/50 transition-all">
                    <option value="">Unassigned</option>
                    {% for m in memberships %}
                    <option value="{{ m.user.id }}">{{ m.user.email }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-600 dark:text-white/60 mb-1.5">Reviewer</label>
                <select name="reviewer"
                    class="w-full rounded-xl border border-gray-200 dark:border-white/10 bg-white dark:bg-white/[.04] px-3 py-2.5 text-sm text-gray-900 dark:text-white focus:ring-2 focus:ring-brand/50 transition-all">
                    <option value="">None</option>
                    {% for m in memberships %}
                    <option value="{{ m.user.id }}">{{ m.user.email }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="flex items-center justify-end gap-2">
            <a href="{% url 'dashboard_project_detail' pk=project.id %}"
                class="px-4 py-2.5 rounded-xl text-sm font-semibold text-gray-500 dark:text-white/50 hover:bg-gray-50 dark:hover:bg-white/[.04] transition-all">Cancel</a>
            <button type="submit"
                class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-brand to-brand-dark text-white text-sm font-semibold shadow-lg shadow-brand/20 hover:shadow-brand/30 hover:scale-[1.01] transition-all">Create Task</button>
        </div>
    </form>
</div>
{% endblock %}
