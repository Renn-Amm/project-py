services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: taskmanager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build: .
    command: >
      sh -c "
        until pg_isready -h db -U postgres 2>/dev/null; do sleep 1; done &&
        PGPASSWORD=postgres psql -h db -U postgres -tc \"SELECT 1 FROM pg_database WHERE datname='taskmanager'\" | grep -q 1 || PGPASSWORD=postgres psql -h db -U postgres -c 'CREATE DATABASE taskmanager' &&
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/taskmanager
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_ENV: development
      SECRET_KEY: dev-secret-key-change-in-production
      DEBUG: "true"

volumes:
  postgres_data:

